<div class="layout">
  <aside class="lateral">
    <a class="marca" routerLink="/panel">
      <span class="marca__logo">⇕</span>
      <span>Gestor de<br><strong>elevadores</strong></span>
    </a>

    <nav>
      @for (item of menu; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="activo">
          <span class="icono">{{ item.icono }}</span>{{ item.texto }}
        </a>
      }
    </nav>

    @if (auth.usuario(); as u) {
      <div class="usuario">
        <span class="usuario__avatar">{{ u.nombre.charAt(0) }}</span>
        <div>
          <strong>{{ u.nombre }}</strong>
          <small>{{ u.rol === 'Administrador' ? 'Administrador' : 'Técnico' }}</small>
        </div>
        <button type="button" (click)="auth.logout()" title="Cerrar sesión" aria-label="Cerrar sesión">⎋</button>
      </div>
    }

    <p class="pie">Proyecto de portfolio<br>.NET 10 · Angular 22</p>
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
